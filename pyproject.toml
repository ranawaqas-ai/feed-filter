[project]
name = "feed-filter-proxy"
version = "0.1.0"
description = "Optional local proxy for the Feed Filter extension: holds your Jev key outside the browser"
requires-python = ">=3.11"
dependencies = [
    "fastapi>=0.162.7",
    "typesafe-sdk>=0.7.5",
    "uvicorn>=0.54.0",
]

[tool.uv]
package = false

[dependency-groups]
dev = [
    "pytest>=9.2.0",
]
